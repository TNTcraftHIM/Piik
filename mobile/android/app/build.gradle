plugins { id 'com.android.application' }
android {
 namespace 'tv.piik.android'
 compileSdk 35
 defaultConfig {
  applicationId 'tv.piik.android.channel3'; minSdk 29; targetSdk 35
  versionCode providers.gradleProperty('piikVersionCode').getOrElse('1').toInteger()
  versionName providers.gradleProperty('piikVersion').getOrElse('development')
  ndk { abiFilters 'arm64-v8a', 'x86_64' }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 packaging { jniLibs { useLegacyPackaging = true } }
 androidResources { ignoreAssetsPatterns.add('*.gz') }
 signingConfigs {
  release {
   def keystore = System.getenv('PIIK_ANDROID_KEYSTORE')
   if (keystore) {
    storeFile file(keystore)
    storePassword System.getenv('PIIK_ANDROID_STORE_PASSWORD')
    keyAlias System.getenv('PIIK_ANDROID_KEY_ALIAS')
    keyPassword System.getenv('PIIK_ANDROID_KEY_PASSWORD')
   }
  }
 }
 buildTypes { release { signingConfig signingConfigs.release } }
}
// The official Android artifact version is locked by the Rust dependency.
def cargoLock = file('../../../prototype/channel-android/Cargo.lock').text
def verifierVersion = (cargoLock =~ /(?s)name = "rustls-platform-verifier-android"\s+version = "([^"]+)"/)[0][1]
dependencies {
 implementation "org.rustls:rustls-platform-verifier:$verifierVersion"
 // The verifier AAR's POM omits this dependency; Java shells do not apply Kotlin's plugin.
 implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.10'
}
