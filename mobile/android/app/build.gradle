plugins { id 'com.android.application' }
android {
 namespace 'tv.piik.android'
 compileSdk 35
 defaultConfig {
  applicationId 'tv.piik.android'; minSdk 29; targetSdk 35; versionCode 1; versionName 'development'
  manifestPlaceholders = [appLabel: '@string/app_name']
  ndk { abiFilters 'arm64-v8a', 'x86_64' }
 }
 buildFeatures { buildConfig = true }
 flavorDimensions 'host'
 productFlavors {
  embedded {
   dimension 'host'
   buildConfigField 'boolean', 'EXTERNAL_BROWSER', 'false'
  }
  browser {
   dimension 'host'
   buildConfigField 'boolean', 'EXTERNAL_BROWSER', 'true'
   manifestPlaceholders = [appLabel: 'Piik Browser']
   versionNameSuffix '-browser'
  }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 packaging { jniLibs { useLegacyPackaging = true } }
}
dependencies { implementation files('libs/piik.aar') }
