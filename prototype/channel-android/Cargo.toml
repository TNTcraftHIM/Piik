[package]
name = "piik-channel-android"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
jni = "0.22"
libc = "0.2"
ndk-context = "0.1"
ndk-sys = "0.6"
rustls-platform-verifier = "=0.7.1"
piik-channel-prototype = { path = "../channel-server", features = ["capture"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net"] }

# Workspace-root patch; match Native/Server and the Native README removal criteria.
[patch.crates-io]
rtc-rtp = { git = "https://github.com/TNTcraftHIM/rtc", rev = "3b6d3c0a03a641a92aff7518418c6eeb67cf1444" }
rtc-shared = { git = "https://github.com/TNTcraftHIM/rtc", rev = "3b6d3c0a03a641a92aff7518418c6eeb67cf1444" }
