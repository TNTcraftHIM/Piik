[package]
name = "piik-channel-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
publish = false

[features]
default = []
sqlite = ["dep:rusqlite"]

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5.3"
sha2 = "0.10"
hmac = "0.12"
uuid = { version = "=1.16.0", features = ["v4", "serde"] }
ed25519-dalek = "=2.2.0"
