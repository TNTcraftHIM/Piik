[package]
name = "piik-channel-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false

[features]
default = []
sqlite = ["dep:rusqlite"]
# Policy switches for tests/topology_study.rs only (study branch). Off by
# default; every switch inside also defaults to the shipped rule.
study = []

[dependencies]
rusqlite = { version = "0.41", features = ["bundled", "backup", "fallible_uint"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
argon2 = "0.5.3"
base64ct = { version = "=1.8.3", features = ["alloc"] }
sha2 = "0.10"
hmac = "0.12"
uuid = { version = "=1.16.0", features = ["v4", "serde"] }
unicode-normalization = "=0.1.26"
ed25519-dalek = "=2.2.0"

url = "=2.5.9"
