[package]
name = "piik-channel-mpd"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false
[workspace]
[dependencies]
anyhow = "1"
rquickjs = { version = "=0.14.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "=2.5.9"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_os = "android")'.dependencies]
rquickjs = { version = "=0.14.0", default-features = false, features = ["bindgen"] }
