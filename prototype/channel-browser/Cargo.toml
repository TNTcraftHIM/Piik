[package]
name = "piik-channel-browser"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
piik-channel-core = { path = "../channel-core" }
uuid = { version = "=1.16.0", features = ["v4", "serde", "js"] }
wasm-bindgen = "=0.2.129"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
