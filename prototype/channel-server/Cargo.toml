[package]
name = "piik-channel-prototype"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false
default-run = "piik-channel-prototype"

[[bin]]
name = "piik-channel-prototype"
path = "src/main.rs"

[[bin]]
name = "piik-channel-app"
path = "src/bin/app.rs"
required-features = ["capture"]

[features]
capture = ["piik-channel-native/capture"]

[dependencies]
piik-channel-core = { path = "../channel-core", features = ["sqlite"] }
piik-channel-native = { path = "../channel-native", default-features = false }
rtc = "=0.21.1"
anyhow = "1"
futures-util = "0.3"
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
tower-http = { version = "0.6.6", features = ["fs", "set-header"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "signal", "time", "process", "io-util"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
uuid = { version = "=1.16.0", features = ["v4", "serde"] }
rusqlite = { version = "0.37", features = ["bundled"] }
url = "2.5"
dirs = "6"
webbrowser = "1"
if-addrs = "0.15"
rcgen = { version = "=0.14.10", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ring = "0.17"
semver = "1"
ureq = { version = "=3.5.0", default-features = false, features = ["rustls"] }

[dev-dependencies]
tokio-tungstenite = "0.29"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

# Cargo patches are workspace-root scoped; match channel-native/Cargo.toml.
[patch.crates-io]
rtc = { git = "https://github.com/TNTcraftHIM/rtc", rev = "32373f88e1d1e170b37f3725c8bb2ba57b251b5c" }
