[package]
name = "piik-channel-prototype"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false

[[bin]]
name = "piik-channel-prototype"
path = "src/main.rs"

[dependencies]
piik-channel-core = { path = "../channel-core", features = ["sqlite"] }
piik-channel-native = { path = "../channel-native" }
anyhow = "1"
futures-util = "0.3"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6.6", features = ["fs"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "signal", "time"] }
serde_json = "1"
uuid = { version = "=1.16.0", features = ["v4", "serde"] }

[dev-dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
tokio-tungstenite = "0.29"

# Cargo patches are workspace-root scoped; match channel-native/Cargo.toml.
[patch.crates-io]
rtc = { git = "https://github.com/TNTcraftHIM/rtc", rev = "20cce2480fc0975241e1590ea9d018f68d3fabcc" }
