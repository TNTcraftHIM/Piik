[package]
name = "piik-channel-prototype"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
publish = false

[[bin]]
name = "piik-channel-prototype"
path = "src/main.rs"

[dependencies]
piik-channel-core = { path = "../channel-core", features = ["sqlite"] }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "signal", "time"] }
serde_json = "1"
uuid = { version = "=1.16.0", features = ["v4", "serde"] }

[dev-dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
