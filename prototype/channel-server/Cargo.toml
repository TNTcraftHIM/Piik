[package]
name = "piik-channel-prototype"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false
default-run = "piik-channel-prototype"

[[bin]]
name = "piik-channel-prototype"
path = "src/main.rs"

[[bin]]
name = "piik-channel-app"
path = "src/bin/app.rs"
required-features = ["capture"]

[features]
capture = ["piik-channel-native/capture", "dep:wry", "dep:tao", "dep:webview2-com", "dep:windows-core"]

[dependencies]
piik-channel-core = { path = "../channel-core", features = ["sqlite"] }
piik-channel-native = { path = "../channel-native", default-features = false }
rtc-stun = "=0.21.1"
anyhow = "1"
futures-util = "0.3"
log = "0.4"
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
tower-http = { version = "0.6.6", features = ["fs", "set-header"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "signal", "time", "process", "io-util"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
uuid = { version = "=1.16.0", features = ["v4", "serde"] }
rusqlite = { version = "0.37", features = ["bundled"] }
url = "2.5"
dirs = "6"
webbrowser = "1"
if-addrs = "0.15"
rcgen = { version = "=0.14.10", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ring = "0.17"
semver = "1"
ureq = { version = "=3.5.0", default-features = false, features = ["rustls"] }
tokio-util = { version = "0.7", features = ["io-util"] }
tempfile = "=3.27.0"

[target.'cfg(target_os = "windows")'.dependencies]
wry = { version = "=0.57.2", default-features = false, features = ["os-webview"], optional = true }
tao = { version = "=0.37.2", default-features = false, features = ["rwh_06"], optional = true }
webview2-com = { version = "=0.39.1", optional = true }
windows-core = { version = "=0.62.2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSRunningApplication", "NSResponder", "NSEvent", "NSGraphicsContext", "NSMenu", "NSMenuItem"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSOperation", "block2"] }
block2 = "=0.6.2"

[dev-dependencies]
netwatch = { version = "=0.20.0", git = "https://github.com/TNTcraftHIM/net-tools", rev = "0a61bb64facc469d015f5ba537dda57c94cdcb17" }
tokio-tungstenite = "0.29"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

# Workspace-root patch; match Native/Android and the Native README removal criteria.
[patch.crates-io]
rtc-rtp = { git = "https://github.com/webrtc-rs/rtc", rev = "81fde93b46f8fb1c1a191415558fa3574e48d5c7" }
rtc-shared = { git = "https://github.com/webrtc-rs/rtc", rev = "81fde93b46f8fb1c1a191415558fa3574e48d5c7" }
