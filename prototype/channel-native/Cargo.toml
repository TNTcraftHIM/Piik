[package]
name = "piik-channel-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false
default-run = "piik-channel-native"

[workspace]

[dependencies]
piik-channel-core = { path = "../channel-core", features = ["sqlite"] }
webrtc = "=0.21.1"
rtc = "=0.21.1"
portmapper = { version = "=0.20.0", default-features = false }
netwatch = "=0.20.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "signal", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
anyhow = "1"
async-trait = "0.1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
uuid = { version = "=1.16.0", features = ["v4", "serde"] }
getrandom = "=0.3.4"
aes-gcm = "=0.10.3"
base64 = "=0.22.1"
sha2 = "=0.10.9"
subtle = "=2.6.1"

# Remove after upstream webrtc-rs/rtc#296 and #298 are released; see README.md.
[patch.crates-io]
rtc = { git = "https://github.com/TNTcraftHIM/rtc", rev = "32373f88e1d1e170b37f3725c8bb2ba57b251b5c" }

[target.'cfg(windows)'.dependencies]
wasapi = "=0.26.0"
rusty-opus = "=1.0.2"
windows-capture = "=2.0.1"
windows-core = "=0.62.2"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Threading", "Win32_System_Performance", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Media_MediaFoundation", "Win32_Media_Audio", "Win32_Security"] }
