[package]
name = "piik-channel-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false
default-run = "piik-channel-native"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
n0-watcher = "=1.0.1"
rustls-native-certs = "0.8"

[workspace]

[features]
default = ["capture"]
capture = [
    "dep:ashpd",
    "dep:reis",
    "dep:gst",
    "dep:gst-app",
    "dep:gst-video",
    "dep:cidre",
    "dep:windows-capture",
    "dep:wasapi",
    "dep:rusty-opus",
    "dep:ndk",
    "dep:ndk-context",
    "dep:jni",
    "dep:khronos-egl",
    "dep:glow",
    "dep:vpx-sys",
    "windows/Foundation_Metadata",
    "windows/Graphics_Capture",
    "windows/Security_Authorization_AppCapabilityAccess",
    "windows/Win32_System_Com",
    "windows/Win32_System_Com_StructuredStorage",
    "windows/Win32_System_Ole",
    "windows/Win32_System_Variant",
    "windows/Win32_System_Performance",
    "windows/Win32_Devices_Display",
    "windows/Win32_Graphics_Direct2D",
    "windows/Win32_Graphics_Direct2D_Common",
    "windows/Win32_Graphics_Imaging",
    "windows/Win32_Graphics_Direct3D",
    "windows/Win32_Graphics_Direct3D11",
    "windows/Win32_Graphics_Direct3D10",
    "windows/Win32_Graphics_Dxgi",
    "windows/Win32_Graphics_Dxgi_Common",
    "windows/Win32_Media_MediaFoundation",
    "windows/Win32_Media_Audio",
]

[dependencies]
h264-reader = "=0.9.0"
bytes = "=1.12.1"
piik-channel-core = { path = "../channel-core", features = ["sqlite"] }
str0m = { version = "=0.26.0", git = "https://github.com/TNTcraftHIM/str0m", rev = "9cd8827dfac502038a0c6c48cf2afdd084b5da19", default-features = false, features = ["rust-crypto"] }
rtc-rtp = "=0.21.1"
rtc-shared = { version = "=0.21.1", default-features = false, features = ["marshal"] }
url = "=2.5.9"
rtc-stun = "=0.21.1"
rtc-turn = "=0.21.1"
rtc-crypto = { version = "=0.21.1", default-features = false, features = ["crypto-ring"] }
sansio = "1"
portmapper = { version = "=0.20.0", git = "https://github.com/TNTcraftHIM/net-tools", rev = "d13e83360e917a63dfad6ed6254757542f7a45f9", default-features = false }
netwatch = { version = "=0.20.0", git = "https://github.com/TNTcraftHIM/net-tools", rev = "d13e83360e917a63dfad6ed6254757542f7a45f9" }
socket2 = { version = "0.6", features = ["all"] }
noq-udp = "=1.4.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "signal", "time", "process", "io-util", "io-std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = { version = "0.3", features = ["sink"] }
anyhow = "1"
log = "0.4"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
uuid = { version = "=1.16.0", features = ["v4", "serde"] }
getrandom = "=0.3.4"
aes-gcm = "=0.10.3"
base64 = "=0.22.1"
sha2 = "=0.10.9"
subtle = "=2.6.1"
zip = { version = "=9.2.1", default-features = false }
tempfile = "=3.27.0"

[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "=0.9.0", optional = true, features = ["api-level-29", "media"] }
ndk-context = { version = "0.1", optional = true }
jni = { version = "0.22", optional = true }
khronos-egl = { version = "=6.0.0", optional = true, features = ["static", "no-pkg-config"] }
glow = { version = "=0.16.0", optional = true }
rustls-platform-verifier = "=0.7.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1", features = ["fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
cidre = { version = "=0.29.0", optional = true, default-features = false, features = ["sc", "vt", "iio", "async", "io_surface", "av", "core_audio", "macos_13_0"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFArray", "CFDictionary", "CFNumber", "CFString", "CFCGTypes"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "CGEvent", "CGEventTypes", "CGEventSource", "CGRemoteOperation", "CGDisplayConfiguration", "CGDirectDisplay", "CGWindow", "CGGeometry", "libc"] }
objc2-application-services = { version = "=0.3.2", default-features = false, features = ["std", "HIServices", "AXUIElement", "AXError", "AXValue", "libc"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSEvent"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "=0.13.13", optional = true, default-features = false, features = ["tokio", "screencast", "remote_desktop", "global_shortcuts"] }
reis = { version = "=0.7.1", optional = true }
rustix = { version = "1", features = ["time", "net"] }
gst = { package = "gstreamer", version = "=0.24.5", optional = true, features = ["v1_20"] }
gst-app = { package = "gstreamer-app", version = "=0.24.5", optional = true, features = ["v1_20"] }
gst-video = { package = "gstreamer-video", version = "=0.24.5", optional = true, features = ["v1_20"] }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux", target_os = "android"))'.dependencies]
rusty-opus = { version = "=1.0.2", optional = true }

# Temporary upstream H264 parser fix: webrtc-rs/rtc#308; removal in README.md.
[patch.crates-io]
rtc-turn = { path = "../../native/third_party/rtc-turn" }
rtc-rtp = { git = "https://github.com/webrtc-rs/rtc", rev = "81fde93b46f8fb1c1a191415558fa3574e48d5c7" }
# The parser's public errors and marshal traits share this unchanged crate.
rtc-shared = { git = "https://github.com/webrtc-rs/rtc", rev = "81fde93b46f8fb1c1a191415558fa3574e48d5c7" }

[target.'cfg(windows)'.dependencies]
vpx-sys = { package = "libvpx-native-sys", version = "=5.0.17", optional = true }
vigem-rust = { version = "=0.2.0", default-features = false, features = ["x360"] }
wasapi = { version = "=0.27.0", optional = true }
windows-capture = { version = "=2.0.1", optional = true }
windows-core = "=0.62.2"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Security"] }
