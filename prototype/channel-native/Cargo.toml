[package]
name = "piik-channel-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false

[workspace]

[dependencies]
piik-channel-prototype = { path = "../channel-server", default-features = false, features = ["sqlite"] }
webrtc = "=0.21.1"
rtc = "=0.21.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "signal", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
anyhow = "1"
async-trait = "0.1"
serde_json = "1"
uuid = { version = "=1.16.0", features = ["v4", "serde"] }
getrandom = "=0.3.4"
