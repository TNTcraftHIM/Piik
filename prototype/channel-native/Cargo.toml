[package]
name = "piik-channel-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false
default-run = "piik-channel-native"

[workspace]

[dependencies]
piik-channel-core = { path = "../channel-core", features = ["sqlite"] }
webrtc = "=0.21.1"
rtc = "=0.21.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "signal", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
anyhow = "1"
async-trait = "0.1"
serde_json = "1"
uuid = { version = "=1.16.0", features = ["v4", "serde"] }
getrandom = "=0.3.4"

# Remove after upstream webrtc-rs/rtc#296 is released; provenance is in README.md.
[patch.crates-io]
rtc = { git = "https://github.com/TNTcraftHIM/rtc", rev = "20cce2480fc0975241e1590ea9d018f68d3fabcc" }
