<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Piik · A 封面</title>
  <link rel="stylesheet" href="../../engine/brand-mark.css">
  <link rel="stylesheet" href="./cover.css">
  <script type="module" src="./cover.js"></script>
</head>
<body>
  <main id="cover" aria-label="Piik：免费开源的屏幕共享与异地联机工具。低延迟、免安装观看、可自部署。">
    <div class="diagonal" aria-hidden="true"></div>
    <header>
      <div class="brand"><span class="brand-art"></span><span>Piik<span class="identity-dot">.</span></span></div>
      <div class="edition"><b>免费 · 开源</b><span>FREE &amp; OPEN SOURCE</span></div>
    </header>
    <div class="headline">
      <div class="kicker">一个链接，把朋友叫过来。</div>
      <h1><span class="line-one">屏幕共享</span><span class="line-two">异地联机</span></h1>
      <div class="subline">一起看<span>·</span>开麦聊<span>·</span>远程玩</div>
    </div>
    <div class="scene">
      <div class="backplate" aria-hidden="true"></div>
      <div class="display">
        <div class="display-title"><span class="live-dot"></span><b>屏幕分享中</b><span>PIIK / SHARE &amp; PLAY</span></div>
        <div class="game"></div>
        <div class="display-footer"><span class="host-label">房主分享</span><span class="viewer-label">朋友远程操作</span></div>
      </div>
      <svg class="cursor" viewBox="0 0 110 140" aria-hidden="true"><path d="M12 8 96 71 59 79 84 120 62 132 40 89 12 117Z" fill="var(--cream)" stroke="var(--ink)" stroke-width="9" stroke-linejoin="round"/></svg>
      <svg class="audience" viewBox="0 0 720 300" aria-hidden="true"></svg>
    </div>
    <footer><span>低延迟<span class="divider">/</span>免安装观看<span class="divider">/</span>可自部署</span><span class="url">piik.tv</span></footer>
    <div class="paper" aria-hidden="true"></div>
  </main>
</body>
</html>
