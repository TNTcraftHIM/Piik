      <g fill="#6eaa96"><path d="M318 264h66l-9 18q-23 13-48-1Z"/><path d="M429 235h62l-9 18q-22 10-45-1Z"/><path d="M542 262h78l-13 23q-26 14-53-2Z"/></g>
