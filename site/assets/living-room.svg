    </g>
    <circle cx="470" cy="316" r="2.5" fill="#f7f4e9" stroke="none"/>
    <rect x="245" y="346" width="447" height="18" rx="9" fill="#d6b58d"/><path d="M267 365v47m403-47v47"/>
