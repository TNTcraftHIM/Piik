<svg xmlns="http://www.w3.org/2000/svg" id="still" width="900" height="590" viewBox="0 0 900 590" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Room for your people</title>
  <desc id="desc">A green host wearing a small gold crown plays a game with a small gamepad. On the screen, a little television hops between floating islands and collects two golden lights. Three round-headed friends watch from a warm orange sofa, while the Piik mascot keeps the group company.</desc>
  <defs>
    <g id="person" fill="currentColor" stroke="none">
      <circle cx="0" cy="-31" r="20"/>
      <path d="M-35 51.5c0-32.5 12.5-50 35-50s35 17.5 35 50q0 7.5-7.5 7.5h-55Q-35 59-35 51.5Z"/>
    </g>
    <g id="eyes" fill="#22303e" stroke="none"><ellipse cx="-7" cy="-30.75" rx="2.75" ry="3.75"/><ellipse cx="7" cy="-30.75" rx="2.75" ry="3.75"/></g>
    <clipPath id="screen"><rect x="284" y="111" width="370" height="190" rx="13"/></clipPath>
  </defs>
  <style>
    .game-player { transform-box:fill-box; transform-origin:50% 100%; }
    .person-body { transform-origin:0 59px; }
    .person-eyes { transform-origin:0 -30.75px; }
    @media (prefers-reduced-motion:no-preference) {
      .game-player { animation:hop-across 8.8s ease-in-out infinite; }
      .game-token-first { animation:collect-first 8.8s linear infinite; }
      .game-token-second { animation:collect-second 8.8s linear infinite; }
      .person-body { animation:lean var(--pace) ease-in-out var(--phase) infinite; }
      .person-eyes { animation:look var(--pace) ease-in-out var(--phase) infinite; }
      .game-hand { animation:play 7.4s ease-in-out var(--tap-delay,0s) infinite; }
    }
    :root:target .game-player, :root:target .game-token-first, :root:target .game-token-second, :root:target .person-body, :root:target .person-eyes, :root:target .game-hand { animation:none; }
    @keyframes lean { 0%,36%,43%,100%{transform:none} 38%,41%{transform:rotate(3deg)} }
    @keyframes look { 0%,3%,3.6%,12%,16%,47%,47.6%,61%,67%,100%{transform:none} 3.3%,47.3%{transform:scaleY(.14)} 13%,15%{transform:translate(2px,-2px)} 62%,63%{transform:translateX(-2px)} 65%,66%{transform:translateX(2px)} }
    @keyframes hop-across {
      0%,8%,100% { transform:none; opacity:1; }
      12% { transform:translateY(2px) scale(1.08,.9); }
      25% { transform:translate(54px,-68px) rotate(-8deg); }
      38% { transform:translate(108px,-29px) scale(1.08,.92); }
      42%,46% { transform:translate(108px,-29px); }
      58% { transform:translate(163px,-81px) rotate(7deg); }
      70% { transform:translate(218px,-2px) scale(1.08,.92); }
      74%,86% { transform:translate(218px,-2px); opacity:1; }
      91% { transform:translate(218px,-2px); opacity:0; }
      92%,95% { transform:none; opacity:0; }
    }
    @keyframes collect-first { 0%,24%,100%{opacity:1} 28%,93%{opacity:0} }
    @keyframes collect-second { 0%,57%,100%{opacity:1} 61%,93%{opacity:0} }
    @keyframes play { 0%,19%,27%,54%,64%,100%{transform:none} 22%,25%{transform:translate(-2px,-2px)} 57%,61%{transform:translate(2px,-1px)} }
  </style>
