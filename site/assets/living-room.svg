<svg xmlns="http://www.w3.org/2000/svg" width="900" height="590" viewBox="0 0 900 590" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">A front-row seat with your friends</title>
  <desc id="desc">Four softly rounded friends settle into a little living room. The green player holds a controller; blue, orange and pink friends lean together on the sofa. A television shows an original little platform adventure, with rolling hills, a star and a finish flag.</desc>
  <defs>
    <clipPath id="screen"><rect x="281" y="91" width="374" height="214" rx="16"/></clipPath>
    <!-- Rounded avatar silhouettes, with just enough posture to feel seated. -->
    <g id="friend" stroke="#22303E" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 23h10v6c8 2 12 10 12 19 0 6-8 8-17 8S3 54 3 48c0-9 4-17 12-19Z" fill="currentColor"/>
      <rect x="10" y="3" width="20" height="23" rx="9.5" fill="currentColor"/>
      <g fill="#22303E" stroke="none">
        <circle cx="17" cy="14" r="1.1"/>
        <circle cx="23" cy="14" r="1.1"/>
      </g>
      <path d="M18 20q2 2 4 0" fill="none" stroke-width=".8"/>
    </g>
  </defs>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .game-player { animation: game-jump 3.6s ease-in-out; }
      .game-star { transform-box: fill-box; transform-origin: center; animation: star-cheer 3.6s ease-in-out; }
      .controller { animation: controller-tap 3.6s ease-in-out; }
      @keyframes controller-tap { 0%, 13%, 22%, 100% { transform: translateY(0); } 17% { transform: translateY(2px); } }
      @keyframes game-jump { 0%, 20%, 52%, 100% { transform: translate(0, 0); } 35% { transform: translate(8px, -32px); } }
      @keyframes star-cheer { 0%, 31%, 55%, 100% { transform: scale(1) rotate(0deg); } 39% { transform: scale(1.2) rotate(12deg); } 46% { transform: scale(1.08) rotate(-7deg); } }
    }
  </style>

  <!-- A self-contained room, with transparent space around its edges. -->
  <path d="M80 244C80 117 187 47 329 46C445 45 478 18 589 36C737 60 829 162 839 302C849 444 764 531 607 546L282 541C131 532 53 452 64 350Z" fill="#F5F2E9"/>
  <path d="M137 231C147 114 257 82 369 85C496 89 562 54 666 114C755 165 783 239 772 335H131Z" fill="#DEEBDF"/>
  <ellipse cx="455" cy="509" rx="348" ry="48" fill="#C8DACC"/>
  <ellipse cx="455" cy="509" rx="295" ry="30" stroke="#F5F2E9" stroke-width="3"/>

  <g stroke="#22303E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- The screen is an illustration, not a product screenshot. -->
    <path d="m324 328-15 27m300-27 15 27"/>
    <rect x="263" y="73" width="410" height="252" rx="27" fill="#22303E"/>
    <rect x="281" y="91" width="374" height="214" rx="16" fill="#CDE7E7" stroke="none"/>
    <g clip-path="url(#screen)" stroke="none">
      <circle cx="591" cy="130" r="22" fill="#F8D474"/>
      <path d="M261 251C314 157 370 169 423 229C475 154 549 170 591 229C623 204 650 205 678 229V322H261Z" fill="#9DCAB9"/>
      <path d="M259 281C333 231 357 250 404 269C487 203 542 234 589 269C620 236 651 244 682 263V322H259Z" fill="#6CADA0"/>
      <path d="M281 284H405V306H281Zm181-42h85v13h-85Zm105 38h84v26h-84Z" fill="#F5F2E9"/>
      <path d="M281 302H405V320H281Zm181-47h85v10h-85Zm105 43h84v19h-84Z" fill="#D4B58E"/>
      <g class="game-star">
        <path d="m443 146 7 14 16 3-12 11 3 16-14-8-14 8 3-16-12-11 16-3Z" fill="#FFD578"/>
      </g>
      <path d="M393 234C396 220 404 208 419 201" stroke="#F5F2E9" stroke-width="4" stroke-linecap="round" stroke-dasharray="3 10"/>
      <g class="game-player">
        <rect x="422" y="205" width="26" height="30" rx="11" fill="#F7B471" transform="rotate(-12 435 220)"/>
        <path d="m428 236-5 5m18-8 6 4" stroke="#22303E" stroke-width="3" stroke-linecap="round"/>
        <circle cx="439" cy="215" r="2" fill="#22303E"/>
      </g>
      <path d="M599 279v-75" stroke="#22303E" stroke-width="3" stroke-linecap="round"/>
      <path d="M601 206h31l-9 12 9 12h-31Z" fill="#F29A78"/>
      <path d="M309 125h24m-12-7v14m25-7h11" stroke="#F5F2E9" stroke-width="5" stroke-linecap="round"/>
    </g>
    <path d="M469 315h0" stroke="#EAEFE2" stroke-width="4"/>
    <rect x="245" y="352" width="445" height="19" rx="9" fill="#D4B58E"/>
    <path d="M267 373v57m402-57v57"/>

    <!-- A plant and a small, winking Piik mascot. -->
    <path d="M133 348v-77m0 43c-29-2-40-17-40-35 26 0 40 15 40 35Zm0-23c28-2 41-19 40-39-26 2-40 17-40 39Zm0-14c-22-13-26-33-17-50 21 14 25 31 17 50Z" fill="#77AB88" stroke-width="3.5"/>
    <path d="m111 338 5 40c1 8 34 8 35 0l5-40Z" fill="#D7AC81" stroke-width="3.5"/>
    <path d="M109 339h49" stroke-width="3.5"/>
    <path d="M704 90c0-15 12-27 27-27h57c15 0 27 12 27 27v34c0 15-12 27-27 27h-41l-22 16 3-17c-14-2-24-12-24-26Z" fill="#FFFCF4" stroke="none"/>
    <g transform="translate(726 74) scale(2.05)" stroke-width="2.4">
      <path d="m11 4 5 4 5-4"/>
      <rect x="4" y="8" width="24" height="18" rx="4"/>
      <circle cx="11.5" cy="16.5" r="1.25" fill="#22303E" stroke="none"/>
      <path d="M19 17c1.5-1.8 3.2-1.8 4.7 0M10 29l2-3m10 3-2-3"/>
    </g>
    <path d="m724 226 9-7m17 17 12-1m-17-32 2-11" stroke="#CB9270" stroke-width="4"/>

    <!-- Warm seating, and one green player with the controller. -->
    <path d="m352 494-5 28m397-28 5 28"/>
    <rect x="323" y="376" width="450" height="118" rx="34" fill="#EBA064"/>
    <path d="M466 386v89m147-89v89" stroke="#C98355" stroke-width="3"/>
    <path d="M165 472v38m118-38v38"/>
    <rect x="124" y="365" width="188" height="124" rx="36" fill="#D58655"/>
    <path d="M143 393c0-20 11-32 30-32h84c20 0 34 14 34 33v55H143Z" fill="#F0AE76" stroke="none"/>
    <use href="#friend" transform="translate(152 277) scale(3.2)" color="#6AB798"/>
    <g class="controller">
      <path d="M183 391q-4 21 20 14m50-14q9 17-11 17" stroke="#22303E" stroke-width="16"/>
      <path d="M183 391q-4 21 20 14m50-14q9 17-11 17" stroke="#6AB798" stroke-width="10"/>
      <path d="M210 386c-9 0-16 12-17 23-1 8 5 12 10 6l8-8h24l8 8c5 6 11 2 10-6-1-11-8-23-17-23Z" fill="#F5F2E9" stroke-width="3.5"/>
      <path d="M210 394v10m-5-5h10" stroke-width="3"/>
      <circle cx="237" cy="396" r="2.5" fill="#E59C6F" stroke="none"/>
      <circle cx="242" cy="403" r="2.5" fill="#6AB798" stroke="none"/>
    </g>
    <path d="M136 423h34v49h-10c-14 0-24-10-24-24Z" fill="#E99B62"/>

    <!-- Friends have distinct blue, orange and pink avatar colors. -->
    <g transform="rotate(-5 424 433)">
      <use href="#friend" transform="translate(360 279) scale(3.2)" color="#81AED7"/>
      <path d="M387 401q1 24 30 24m45-23q-1 20-20 23" stroke="#22303E" stroke-width="15"/>
      <path d="M387 401q1 24 30 24m45-23q-1 20-20 23" stroke="#81AED7" stroke-width="9"/>
    </g>
    <g transform="rotate(3 550 435)">
      <use href="#friend" transform="translate(486 285) scale(3.2)" color="#F0B26C"/>
      <path d="M514 405q-2 22 23 22m45-23q2 23-23 23" stroke="#22303E" stroke-width="15"/>
      <path d="M514 405q-2 22 23 22m45-23q2 23-23 23" stroke="#F0B26C" stroke-width="9"/>
    </g>
    <g transform="rotate(6 677 435)">
      <use href="#friend" transform="translate(612 276) scale(3.2)" color="#DFA1B6"/>
      <path d="M641 401q5 23 28 24m47-27q12 6 28 2" stroke="#22303E" stroke-width="15"/>
      <path d="M641 401q5 23 28 24m47-27q12 6 28 2" stroke="#DFA1B6" stroke-width="9"/>
    </g>
    <path d="M322 430c0-11 8-19 18-19s18 8 18 19v47h381v-47c0-11 8-19 18-19s18 8 18 19v47c0 15-12 27-27 27H349c-15 0-27-12-27-27Z" fill="#E99B62"/>
    <path d="M370 478h357" stroke="#C98355" stroke-width="3"/>
    <path d="m169 248-9-8m28-7-2-12m-39 45-12-1" stroke="#77AB88" stroke-width="4"/>
  </g>
</svg>
