name: iOS build

on:
  push:
    branches: [feat/ios-client]
    paths:
      - 'mobile/**'
      - 'internal/**'
      - 'src/**'
      - 'scripts/build-ios.mjs'
      - 'scripts/package-licenses.mjs'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: npm ci
      - name: Install the pinned mobile binding tools
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20261011034528-197770444867
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20261011034528-197770444867
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build the shared bridge and both Apple SDK targets
        run: node scripts/build-ios.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: piik-ios-unsigned-${{ github.sha }}
          path: |
            build/ios-client/DerivedData/Build/Products/Debug-iphoneos/Piik.app
            build/ios-client/DerivedData/Build/Products/Debug-iphonesimulator/Piik.app
          if-no-files-found: error
