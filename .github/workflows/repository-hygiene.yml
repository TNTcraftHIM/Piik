name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate tracked project state
        run: sh scripts/check-project-state.sh
        env:
          SCREENER_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check, test, and build
        run: npm run check
