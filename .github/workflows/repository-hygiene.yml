name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      client_checks:
        description: Run the optional Screener Client checks
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      client_scope: ${{ steps.client-scope.outputs.run }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Validate tracked project state
        run: sh scripts/check-project-state.sh
        env:
          SCREENER_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Detect Screener Client scope
        id: client-scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EXPLICIT_CLIENT_CHECKS: ${{ inputs.client_checks || false }}
        run: |
          run_client=false
          if [ "$EXPLICIT_CLIENT_CHECKS" = "true" ]; then
            run_client=true
          elif [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            base="$BASE_SHA"
            case "$base" in
              ""|0000000000000000000000000000000000000000)
                base=$(git rev-parse HEAD^ 2>/dev/null || true)
                ;;
            esac
            if [ -n "$base" ] && ! git diff --quiet "$base" HEAD -- \
              native/client \
              scripts/assemble-client.mjs \
              scripts/check-client.mjs \
              scripts/client-local-gate.ts \
              scripts/client-loopback-gate.ts \
              scripts/client-media-gate.ts; then
              run_client=true
            fi
          fi
          echo "run=$run_client" >> "$GITHUB_OUTPUT"
      - name: Set up Go
        if: steps.client-scope.outputs.run == 'true'
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.6
          cache-dependency-path: native/client/go.sum
      - name: Check Screener Client
        if: steps.client-scope.outputs.run == 'true'
        run: npm run check:client-core
      - name: Install dependencies
        run: npm ci
      - name: Type-check, test, and build
        run: npm run check

  windows-client-capture:
    needs: validate
    if: needs.validate.outputs.client_scope == 'true'
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Build Windows capture process
        run: npm run check:client-capture
