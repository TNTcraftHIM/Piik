name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      client_checks:
        description: Run the optional Screener Client checks
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Validate tracked project state
        run: sh scripts/check-project-state.sh
        env:
          SCREENER_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Install dependencies
        run: npm ci
      # The Go build embeds internal/server/webassets/dist, so Vite runs first.
      - name: Build the Browser client
        run: npm run build:client
      - name: Cache Go toolchain
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/go
          key: ${{ runner.os }}-go-1.26.6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.6
          cache-dependency-path: go.sum
      - name: Check Go core
        run: npm run check:client-core
      - name: Type-check, test, and build
        run: npm run check

  release-application:
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.client_checks == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Cache Go toolchain
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/go
          key: ${{ runner.os }}-go-1.26.6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.6
          cache-dependency-path: go.sum
      - name: Install dependencies
        run: npm ci
      - name: Package application release
        run: node scripts/package-app-release.mjs "$RUNNER_TEMP/app-release"
      - name: Upload application release
        uses: actions/upload-artifact@v7
        with:
          name: screener-app-${{ github.sha }}
          path: ${{ runner.temp }}/app-release/*
          if-no-files-found: error
          retention-days: 14

  release-clients:
    needs:
      - validate
      - release-application
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.client_checks == true
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-amd64
            runner: windows-latest
          - target: linux-amd64
            runner: ubuntu-latest
          - target: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Cache Go toolchain
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/go
          key: ${{ runner.os }}-go-1.26.6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.6
          cache-dependency-path: go.sum
      # scripts/assemble-client.mjs runs `npm run build:client` for the Web
      # assets the Client binary embeds, so Vite and the license inputs must be
      # installed here too.
      - name: Install dependencies
        run: npm ci
      - name: Install Linux native capture dependencies
        if: matrix.target == 'linux-amd64'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libportal-dev
          libgstreamer1.0-dev
          libgstreamer-plugins-base1.0-dev
          gstreamer1.0-pipewire
          gstreamer1.0-plugins-bad
          gstreamer1.0-pulseaudio
      - name: Download application release
        uses: actions/download-artifact@v8
        with:
          name: screener-app-${{ github.sha }}
          path: ${{ runner.temp }}/app-release
      - name: Build and verify Client candidate
        run: >-
          node scripts/package-client-candidate.mjs
          "${{ runner.temp }}/app-release"
          "${{ matrix.target }}"
          "${{ runner.temp }}/client-release"
      - name: Upload Client release candidate
        uses: actions/upload-artifact@v7
        with:
          name: screener-client-${{ matrix.target }}-${{ github.sha }}
          path: ${{ runner.temp }}/client-release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
