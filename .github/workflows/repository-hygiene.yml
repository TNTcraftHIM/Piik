name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      client_checks:
        description: Run the optional Screener Client checks
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      client_scope: ${{ steps.client-scope.outputs.run }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Validate tracked project state
        run: sh scripts/check-project-state.sh
        env:
          SCREENER_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Detect Screener Client scope
        id: client-scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EXPLICIT_CLIENT_CHECKS: ${{ inputs.client_checks || false }}
        run: |
          run_client=false
          if [ "$EXPLICIT_CLIENT_CHECKS" = "true" ]; then
            run_client=true
          elif [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            base="$BASE_SHA"
            case "$base" in
              ""|0000000000000000000000000000000000000000)
                base=$(git rev-parse HEAD^ 2>/dev/null || true)
                ;;
            esac
            if [ -n "$base" ] && ! git diff --quiet "$base" HEAD -- \
              .github/workflows/repository-hygiene.yml \
              .node-version \
              LICENSE \
              licenses \
              index.html \
              cmd \
              internal \
              native \
              go.mod \
              go.sum \
              package.json \
              package-lock.json \
              public \
              src \
              tsconfig.json \
              tsconfig.app.json \
              vite.config.ts \
              scripts/assemble-client.mjs \
              scripts/archive-tool.mjs \
              scripts/client-icons.mjs \
              scripts/package-app-release.mjs \
              scripts/package-licenses.mjs \
              scripts/package-client-candidate.mjs \
              scripts/client-package-targets.mjs \
              scripts/check-client.mjs \
              scripts/client-local-gate.ts \
              scripts/client-loopback-gate.ts \
              scripts/client-media-gate.ts; then
              run_client=true
            fi
          fi
          echo "run=$run_client" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: npm ci
      # The Go build embeds internal/server/webassets/dist, so Vite runs first.
      - name: Build the Browser client
        run: npm run build:client
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.6
          cache-dependency-path: go.sum
      - name: Check Go core
        run: npm run check:client-core
      - name: Type-check, test, and build
        run: npm run check

  release-application:
    needs: validate
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      needs.validate.outputs.client_scope == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.6
          cache-dependency-path: go.sum
      - name: Install dependencies
        run: npm ci
      - name: Package application release
        run: node scripts/package-app-release.mjs "$RUNNER_TEMP/app-release"
      - name: Upload application release
        uses: actions/upload-artifact@v7
        with:
          name: screener-app-${{ github.sha }}
          path: ${{ runner.temp }}/app-release/*
          if-no-files-found: error
          retention-days: 14

  release-clients:
    needs:
      - validate
      - release-application
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      needs.validate.outputs.client_scope == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-amd64
            runner: windows-latest
          - target: linux-amd64
            runner: ubuntu-latest
          - target: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.6
          cache-dependency-path: go.sum
      # scripts/assemble-client.mjs runs `npm run build:client` for the Web
      # assets the Client binary embeds, so Vite and the license inputs must be
      # installed here too.
      - name: Install dependencies
        run: npm ci
      - name: Install Linux native capture dependencies
        if: matrix.target == 'linux-amd64'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libportal-dev
          libgstreamer1.0-dev
          libgstreamer-plugins-base1.0-dev
          gstreamer1.0-pipewire
          gstreamer1.0-plugins-bad
          gstreamer1.0-pulseaudio
      - name: Download application release
        uses: actions/download-artifact@v8
        with:
          name: screener-app-${{ github.sha }}
          path: ${{ runner.temp }}/app-release
      - name: Build and verify Client candidate
        run: >-
          node scripts/package-client-candidate.mjs
          "${{ runner.temp }}/app-release"
          "${{ matrix.target }}"
          "${{ runner.temp }}/client-release"
      - name: Upload Client release candidate
        uses: actions/upload-artifact@v7
        with:
          name: screener-client-${{ matrix.target }}-${{ github.sha }}
          path: ${{ runner.temp }}/client-release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
