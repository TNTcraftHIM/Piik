name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      client_checks:
        description: Run the optional Piik App checks
        required: false
        default: false
        type: boolean
      candidate_version:
        description: Optional candidate version (vMAJOR.MINOR.PATCH); never publishes
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Validate tracked project state
        run: sh scripts/check-project-state.sh
        env:
          PIIK_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Install dependencies
        run: npm ci
      - name: Determine release identity
        id: release
        env:
          PIIK_BUILD_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_version || '' }}
        run: >-
          node scripts/release-version.mjs
          ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PIIK_RELEASES_ENABLED == 'true' && 'plan' || 'build' }}
          --github-output
      - name: Preview release notes
        if: steps.release.outputs.publish == 'true' || inputs.candidate_version != ''
        run: node scripts/release-notes.mjs "$PIIK_RELEASE_VERSION" "$GITHUB_SHA" --github-summary
        env:
          PIIK_RELEASE_VERSION: ${{ steps.release.outputs.version }}
      # The Go build embeds internal/server/webassets/dist, so Vite runs first.
      - name: Build the Browser client
        run: npm run build:client
        env:
          PIIK_BUILD_VERSION: ${{ steps.release.outputs.version }}
          VITE_PIIK_VERSION: ${{ steps.release.outputs.version }}
          VITE_PIIK_REVISION: ${{ github.sha }}
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.6
          cache-dependency-path: go.sum
      - name: Check Go core
        run: npm run check:client-core
      - name: Type-check and test
        run: npm run typecheck && npm test
        env:
          PIIK_BUILD_VERSION: ${{ steps.release.outputs.version }}
          VITE_PIIK_VERSION: ${{ steps.release.outputs.version }}
          VITE_PIIK_REVISION: ${{ github.sha }}

  release-application:
    needs: validate
    if: >-
      needs.validate.outputs.publish == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.client_checks == true)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PIIK_BUILD_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.6
          cache-dependency-path: go.sum
      - name: Install dependencies
        run: npm ci
      - name: Package application release
        run: node scripts/package-app-release.mjs "$RUNNER_TEMP/app-release"
      - name: Upload application release
        uses: actions/upload-artifact@v7
        with:
          name: piik-server-${{ github.sha }}
          path: ${{ runner.temp }}/app-release/*
          if-no-files-found: error
          retention-days: 14

  release-clients:
    needs:
      - validate
      - release-application
    if: >-
      needs.validate.outputs.publish == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.client_checks == true)
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-amd64
            runner: windows-latest
          - target: linux-amd64
            runner: ubuntu-latest
          - target: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      PIIK_BUILD_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.6
          cache-dependency-path: go.sum
      # scripts/assemble-client.mjs runs `npm run build:client` for the Web
      # assets the App binary embeds, so Vite and the license inputs must be
      # installed here too.
      - name: Install dependencies
        run: npm ci
      - name: Install Linux packaging and native capture dependencies
        if: matrix.target == 'linux-amd64'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          zip
          unzip
          libportal-dev
          libgstreamer1.0-dev
          libgstreamer-plugins-base1.0-dev
          gstreamer1.0-pipewire
          gstreamer1.0-plugins-bad
          gstreamer1.0-pulseaudio
      - name: Download application release
        uses: actions/download-artifact@v8
        with:
          name: piik-server-${{ github.sha }}
          path: ${{ runner.temp }}/app-release
      - name: Build and verify App candidate
        run: >-
          node scripts/package-client-candidate.mjs
          "${{ runner.temp }}/app-release"
          "${{ matrix.target }}"
          "${{ runner.temp }}/client-release"
      - name: Upload App release candidate
        uses: actions/upload-artifact@v7
        with:
          name: piik-app-${{ matrix.target }}-${{ github.sha }}
          path: ${{ runner.temp }}/client-release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    needs:
      - validate
      - release-application
      - release-clients
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Download application release
        uses: actions/download-artifact@v8
        with:
          name: piik-server-${{ github.sha }}
          path: ${{ runner.temp }}/publish-release
      - name: Download App release candidates
        uses: actions/download-artifact@v8
        with:
          pattern: piik-app-*-${{ github.sha }}
          path: ${{ runner.temp }}/publish-release
          merge-multiple: true
      - name: Publish verified release
        run: >-
          node scripts/publish-release.mjs
          "$RUNNER_TEMP/publish-release" "$PIIK_RELEASE_VERSION" "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          PIIK_RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      - name: Mirror verified release to Gitee
        run: >-
          node scripts/mirror-release.mjs
          "$RUNNER_TEMP/publish-release" "$PIIK_RELEASE_VERSION" "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          PIIK_RELEASE_VERSION: ${{ needs.validate.outputs.version }}
