name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      native_checks:
        description: Run the optional Native sender research checks
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Validate tracked project state
        run: sh scripts/check-project-state.sh
        env:
          SCREENER_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Detect Native sender scope
        id: native-scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EXPLICIT_NATIVE_CHECKS: ${{ inputs.native_checks || false }}
        run: |
          run_native=false
          if [ "$EXPLICIT_NATIVE_CHECKS" = "true" ]; then
            run_native=true
          elif [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            base="$BASE_SHA"
            case "$base" in
              ""|0000000000000000000000000000000000000000)
                base=$(git rev-parse HEAD^ 2>/dev/null || true)
                ;;
            esac
            if [ -n "$base" ] && ! git diff --quiet "$base" HEAD -- native/sender; then
              run_native=true
            fi
          fi
          echo "run=$run_native" >> "$GITHUB_OUTPUT"
      - name: Set up Go
        if: steps.native-scope.outputs.run == 'true'
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.6
          cache-dependency-path: native/sender/go.sum
      - name: Check native sender
        if: steps.native-scope.outputs.run == 'true'
        working-directory: native/sender
        run: |
          go test ./...
          go vet ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o "$RUNNER_TEMP/screener-sender.exe" ./cmd/screener-sender
      - name: Install dependencies
        run: npm ci
      - name: Type-check, test, and build
        run: npm run check
