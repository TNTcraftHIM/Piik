<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" role="img" aria-labelledby="title desc"><title id="title">网页与媒体使用不同的连接</title><desc id="desc">房主和朋友通过 Piik 站点访问网页与聊天；画面和声音需要另建媒体连接，可通过直连或服务器转发传输。</desc><style>/* Shared theme for the App, website and documentation. Status and selection
   have separate roles; illustrations keep their own colours. */
:root {
  --person-ink: #263b43;
  --wall: #f3f5f8;
  --wall-2: #e5eaf2;
  --paper: #fffefb;
  --ink: #29374a;
  --muted: color-mix(in srgb, var(--ink) 75%, var(--paper));
  --line: color-mix(in srgb, var(--ink) 20%, var(--paper));
  /* Primary actions keep their identity; selection/focus follows the theme. */
  --primary: #2765ce;
  --primary-ink: #fff;
  --action: #3478e5;
  --action-deep: var(--primary);
  --action-ink: var(--primary-ink);
  --action-text: #2055b2;
  --idle: #8ea3b8;
  --busy: #3478e5;
  --live: #2fa66a;
  --warn: #d98e04;
  --danger: #d64541;
  --control-hover: #eef3ff;
  --control-selected: #e5efff;
  --control-selected-ink: #214c9b;
  --control-edge: color-mix(in srgb, var(--ink) 57%, var(--paper));
  --surface-rim: rgb(255 255 255 / .95);
  --surface-shade: rgb(36 53 78 / .18);
  --surface-glaze: linear-gradient(165deg, rgb(255 255 255 / .6), transparent 65%, rgb(51 89 147 / .025));
  --control-shadow: 0 3px 0 var(--surface-shade), 0 5px 10px color-mix(in srgb, var(--surface-shade) 45%, transparent);
  --panel-shadow: inset 0 1px 0 var(--surface-rim), 0 3px 0 var(--surface-shade), 0 16px 36px color-mix(in srgb, var(--surface-shade) 55%, transparent);
  --piik-dark-wall: #242a34;
  --piik-dark-wall-2: #2c3543;
  --piik-dark-paper: #354153;
  --piik-dark-ink: #f6f3eb;
  --piik-dark-action: #f6f3eb;
  --piik-dark-action-ink: #29374a;
  --piik-dark-action-text: var(--piik-dark-action);
  --piik-dark-hover: #414f67;
  --piik-dark-selected: var(--piik-dark-action);
  --piik-dark-selected-ink: var(--piik-dark-action-ink);
}
@media (prefers-color-scheme: dark) { :root {
  --wall: var(--piik-dark-wall);
  --wall-2: var(--piik-dark-wall-2);
  --paper: var(--piik-dark-paper);
  --ink: var(--piik-dark-ink);
  --busy: #82b1ff;
  --live: #3fb97a;
  --warn: #e8a33d;
  --danger: #e25a52;
  --action: var(--piik-dark-action);
  --action-deep: var(--piik-dark-action);
  --action-ink: var(--piik-dark-action-ink);
  --action-text: var(--piik-dark-action-text);
  --control-hover: var(--piik-dark-hover);
  --control-selected: var(--piik-dark-selected);
  --control-selected-ink: var(--piik-dark-selected-ink);
  --control-edge: color-mix(in srgb, var(--ink) 48%, var(--paper));
  --surface-rim: rgb(222 234 255 / .12);
  --surface-shade: rgb(6 12 22 / .38);
  --surface-glaze: linear-gradient(165deg, rgb(224 237 255 / .06), transparent 65%, rgb(0 0 0 / .035));
} }

  text { fill: var(--ink); font: 600 26px system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif; text-anchor: middle; }
  .node { fill: var(--paper); stroke: var(--control-edge); stroke-width: 2; }
  .input { fill: var(--control-selected); }
  .glyph { color: var(--ink); }
  .source .glyph { color: var(--control-selected-ink); }
  .source text { fill: var(--control-selected-ink); }
  .path { fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style><path class="path" d="M164 174h28V64h32m152 0h28v110h28"></path><rect class="node" x="224" y="8" width="152" height="112" rx="20"></rect><g class="glyph" transform="translate(274 18)"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" class="lr-glyph"><rect pathLength="1" x="3" y="4" width="18" height="7" rx="2"></rect><rect pathLength="1" x="3" y="13" width="18" height="7" rx="2"></rect><path pathLength="1" d="M7 7.5h.01M7 16.5h.01"></path></svg></g><text x="300" y="101">Piik 站点</text><g><rect class="node" x="12" y="136" width="152" height="160" rx="20"></rect><g class="glyph" transform="translate(58 164)"><svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" class="lr-glyph"><rect pathLength="1" x="2" y="4" width="20" height="16" rx="2"></rect><path pathLength="1" d="M2 9h20M6 6.5h.01M9 6.5h.01"></path></svg></g><text x="88" y="268">房主</text></g><g><rect class="node" x="436" y="136" width="152" height="160" rx="20"></rect><g class="glyph" transform="translate(482 164)"><svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" class="lr-glyph"><rect pathLength="1" x="2" y="4" width="20" height="16" rx="2"></rect><path pathLength="1" d="M2 9h20M6 6.5h.01M9 6.5h.01"></path></svg></g><text x="512" y="268">朋友</text></g><text x="300" y="173" style="font-size:24px">网页与聊天</text><text x="300" y="232" style="font-size:24px">画面与声音</text><path class="path" d="M164 252h272m-262-8-10 8 10 8m252-16 10 8-10 8"></path><text x="300" y="326" style="font-size:22px;fill:var(--muted)">独立的媒体连接：直连或服务器转发</text></svg>
