<svg xmlns="http://www.w3.org/2000/svg" width="600" height="502" viewBox="0 0 600 502" role="img" aria-labelledby="title desc"><title id="title">分享声音与房间语音</title><desc id="desc">来源声音与可选的分享麦克风跟随画面，由播放音量控制。房间语音使用独立的收听音量。</desc><style>/* Shared theme for the App, website and documentation. Status and selection
   have separate roles; illustrations keep their own colours. */
:root {
  --person-ink: #263b43;
  --wall: #f3f5f8;
  --wall-2: #e5eaf2;
  --paper-rgb: 255 254 251;
  --paper: rgb(var(--paper-rgb));
  --paper-translucent: rgb(var(--paper-rgb) / .84);
  --ink: #29374a;
  /* Opaque sRGB roles also work in WebViews without color-mix. */
  --muted: rgb(94.5 104.75 118.25);
  --line: rgb(212.2 214.2 215.6);
  /* Primary actions keep their identity; selection/focus follows the theme. */
  --primary: #2765ce;
  --primary-ink: #fff;
  --action: #3478e5;
  --action-deep: var(--primary);
  --action-ink: var(--primary-ink);
  --action-text: #2055b2;
  --idle: #8ea3b8;
  --busy: #3478e5;
  --live: #2fa66a;
  --warn: #d98e04;
  --danger: #d64541;
  --control-hover: #eef3ff;
  --control-selected: #e5efff;
  --control-selected-ink: #214c9b;
  --control-edge: rgb(133.02 140.57 150.11);
  --surface-rim: rgb(255 255 255 / .95);
  --surface-shade-rgb: 36 53 78;
  --surface-shade-alpha: .18;
  --surface-shade: rgb(var(--surface-shade-rgb) / var(--surface-shade-alpha));
  --surface-glaze: linear-gradient(165deg, rgb(255 255 255 / .6), transparent 65%, rgb(51 89 147 / .025));
  --control-shadow: 0 3px 0 var(--surface-shade), 0 5px 10px rgb(var(--surface-shade-rgb) / calc(var(--surface-shade-alpha) * .45));
  --panel-shadow: inset 0 1px 0 var(--surface-rim), 0 3px 0 var(--surface-shade), 0 16px 36px rgb(var(--surface-shade-rgb) / calc(var(--surface-shade-alpha) * .55));
  --silip-dark-wall: #242a34;
  --silip-dark-wall-2: #2c3543;
  --silip-dark-paper-rgb: 53 65 83;
  --silip-dark-paper: rgb(var(--silip-dark-paper-rgb));
  --silip-dark-ink: #f6f3eb;
  --silip-dark-muted: rgb(197.75 198.5 197);
  --silip-dark-line: rgb(91.6 100.6 113.4);
  --silip-dark-control-edge: rgb(145.64 150.44 155.96);
  --silip-dark-surface-rim: rgb(222 234 255 / .12);
  --silip-dark-surface-shade-rgb: 6 12 22;
  --silip-dark-surface-shade-alpha: .38;
  --silip-dark-surface-glaze: linear-gradient(165deg, rgb(224 237 255 / .06), transparent 65%, rgb(0 0 0 / .035));
  --silip-dark-action: #f6f3eb;
  --silip-dark-action-ink: #29374a;
  --silip-dark-action-text: var(--silip-dark-action);
  --silip-dark-hover: #414f67;
  --silip-dark-selected: var(--silip-dark-action);
  --silip-dark-selected-ink: var(--silip-dark-action-ink);
}
@media (prefers-color-scheme: dark) { :root {
  --wall: var(--silip-dark-wall);
  --wall-2: var(--silip-dark-wall-2);
  --paper-rgb: var(--silip-dark-paper-rgb);
  --paper: var(--silip-dark-paper);
  --ink: var(--silip-dark-ink);
  --muted: var(--silip-dark-muted);
  --line: var(--silip-dark-line);
  --busy: #82b1ff;
  --live: #3fb97a;
  --warn: #e8a33d;
  --danger: #e25a52;
  --action: var(--silip-dark-action);
  --action-deep: var(--silip-dark-action);
  --action-ink: var(--silip-dark-action-ink);
  --action-text: var(--silip-dark-action-text);
  --control-hover: var(--silip-dark-hover);
  --control-selected: var(--silip-dark-selected);
  --control-selected-ink: var(--silip-dark-selected-ink);
  --control-edge: var(--silip-dark-control-edge);
  --surface-rim: var(--silip-dark-surface-rim);
  --surface-shade-rgb: var(--silip-dark-surface-shade-rgb);
  --surface-shade-alpha: var(--silip-dark-surface-shade-alpha);
  --surface-glaze: var(--silip-dark-surface-glaze);
} }

  text { fill: var(--ink); font: 600 26px system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif; text-anchor: middle; }
  .node { fill: var(--paper); stroke: var(--control-edge); stroke-width: 2; }
  .input { fill: var(--control-selected); }
  .glyph { color: var(--ink); }
  .source .glyph { color: var(--control-selected-ink); }
  .source text { fill: var(--control-selected-ink); }
  .path { fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style><g transform="translate(0 0)"><g class="source"><rect class="node input" x="12" y="4" width="220" height="146" rx="22"></rect><g class="glyph" transform="translate(95 21)"><svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" class="lr-glyph"><rect pathLength="1" x="2" y="4" width="20" height="16" rx="2"></rect><path pathLength="1" d="M2 9h20M6 6.5h.01M9 6.5h.01"></path></svg></g><text x="122" y="118">来源声音</text></g><rect class="node" x="368" y="4" width="220" height="146" rx="22"></rect><g class="glyph" transform="translate(451 21)"><svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" class="lr-glyph"><path pathLength="1" d="M4 9v6h4l5 4V5L8 9H4Z"></path><path pathLength="1" d="M16 9a4.2 4.2 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"></path></svg></g><path class="path" d="M250 77h96m-9-9 9 9-9 9"></path><text x="478" y="118">播放音量</text></g><g transform="translate(0 170)"><g class="source"><rect class="node input" x="12" y="4" width="220" height="146" rx="22"></rect><g class="glyph" transform="translate(95 21)"><svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" class="lr-glyph"><rect pathLength="1" x="9" y="2" width="6" height="13" rx="3"></rect><path pathLength="1" d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"></path></svg></g><text x="122" y="118">分享麦克风</text></g><rect class="node" x="368" y="4" width="220" height="146" rx="22"></rect><g class="glyph" transform="translate(451 21)"><svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" class="lr-glyph"><path pathLength="1" d="M4 9v6h4l5 4V5L8 9H4Z"></path><path pathLength="1" d="M16 9a4.2 4.2 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"></path></svg></g><path class="path" d="M250 77h96m-9-9 9 9-9 9"></path><text x="478" y="118">播放音量</text></g><g transform="translate(0 340)"><g class="source"><rect class="node input" x="12" y="4" width="220" height="146" rx="22"></rect><g class="glyph" transform="translate(95 21)"><svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" class="lr-glyph"><rect pathLength="1" x="9" y="2" width="6" height="13" rx="3"></rect><path pathLength="1" d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"></path></svg></g><text x="122" y="118">房间语音</text></g><rect class="node" x="368" y="4" width="220" height="146" rx="22"></rect><g class="glyph" transform="translate(451 21)"><svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" class="lr-glyph"><path pathLength="1" d="M3 14v-2a9 9 0 0 1 18 0v2"></path><rect pathLength="1" x="3" y="12" width="5" height="9" rx="2"></rect><rect pathLength="1" x="16" y="12" width="5" height="9" rx="2"></rect></svg></g><path class="path" d="M250 77h96m-9-9 9 9-9 9"></path><text x="478" y="118">语音收听</text></g></svg>
